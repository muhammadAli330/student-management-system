{% extends "employees/base.html" %}
{% block content %}
<h1>{% if employee %}Edit Employee{% else %}Add Employee{% endif %}</h1>

<form method="POST" class="employee-form">
    {% csrf_token %}

    <label>Name</label>
    <input type="text" name="name" value="{{ employee.name|default:'' }}" required>

    <label>Email</label>
    <input type="email" name="email" value="{{ employee.email|default:'' }}" required>

    <label>Phone</label>
    <input type="text" name="phone" value="{{ employee.phone|default:'' }}" required>

    <label>Department</label>
    <input type="text" name="department" value="{{ employee.department|default:'' }}" required>

    <label>Position</label>
    <input type="text" name="position" value="{{ employee.position|default:'' }}" required>

    <label>Salary</label>
    <input type="number" step="0.01" name="salary" value="{{ employee.salary|default:'' }}" required>

    <label>Joining Date</label>
    <input type="date" name="joining_date" value="{{ employee.joining_date|date:'Y-m-d' }}" required>

    <button type="submit">
        {% if employee %}Update Employee{% else %}Add Employee{% endif %}
    </button>
</form>
{% endblock %}
