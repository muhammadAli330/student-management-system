<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
</head>

<body>

    {% if student%}

        Update Student

    {% else %}

      Add Student

     {% endif %}


    <form method="POST">

        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" value="{{ student.name|default:''}}" required>

        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ student.email| default:''}}" required>

        <br><br>

        <label>Phone:</label>
        <input type="text" name="phone" value="{{ student.phone |default:''}}">

        <br><br>

        <label>Course:</label>
        <input type="text" name="course" value="{{ student.course|default:''}}">

        <br><br>

        <label>Semester:</label>
        <input type="text" name="semester" value="{{student.semester|default:''}}">

        <br><br>

        <button type="submit">Add Student</button>

    </form>

    <br>

    <a href="{% url 'student_list' %}">
        Back to Students
    </a>

</body>
</html>
